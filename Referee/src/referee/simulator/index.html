<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Referee — Alexa+ Simulator & MCP Inspector</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel-bg: #1e293b;
      --card-bg: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --border: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    html, body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    header {
      height: 50px;
      padding: 0 24px;
      background: #020617;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.1rem; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    header span { font-size: 0.8rem; background: #1e293b; padding: 4px 8px; border-radius: 4px; color: var(--text-muted); }

    .main-container {
      flex: 1;
      height: calc(100vh - 50px);
      display: grid;
      grid-template-columns: 1fr 420px;
      overflow: hidden;
      min-height: 0;
    }

    /* Chat Panel */
    .chat-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      border-right: 1px solid var(--border);
      background: var(--panel-bg);
      overflow: hidden;
    }
    .chat-history {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.4;
      font-size: 0.95rem;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: #0f172a;
      border-bottom-right-radius: 2px;
      font-weight: 500;
    }
    .msg.alexa {
      align-self: flex-start;
      background: var(--card-bg);
      border-bottom-left-radius: 2px;
    }

    /* Verdict Card Embed */
    .verdict-card {
      margin-top: 8px;
      padding: 14px;
      border-radius: 8px;
      border-left: 6px solid var(--border);
      background: #0f172a;
    }
    .verdict-card.green { border-left-color: var(--green); }
    .verdict-card.yellow { border-left-color: var(--yellow); }
    .verdict-card.red { border-left-color: var(--red); }
    .verdict-card.neutral { border-left-color: var(--accent); }
    
    .verdict-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; margin-bottom: 6px; }
    .verdict-body { font-size: 0.85rem; color: var(--text-muted); }

    .input-area {
      height: 70px;
      padding: 14px 16px;
      background: #0f172a;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      align-items: center;
    }
    .input-area input {
      flex: 1;
      height: 42px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0 16px;
      border-radius: 8px;
      outline: none;
      font-size: 0.95rem;
    }
    .input-area input:focus { border-color: var(--accent); }
    .btn {
      height: 42px;
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn-mic { background: var(--border); color: var(--text); padding: 0 14px; }
    .btn-mic.listening { background: var(--red); animation: pulse 1s infinite; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    /* Traffic Side Panel */
    .inspector-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      background: #020617;
      overflow: hidden;
    }
    .inspector-header {
      height: 40px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .traffic-log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px;
      font-family: monospace;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .rpc-block {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .rpc-type { font-weight: bold; margin-bottom: 4px; }
    .rpc-req { color: var(--accent); }
    .rpc-res { color: var(--green); }

    @media (max-width: 800px) {
      .main-container { grid-template-columns: 1fr; grid-template-rows: 1fr 250px; }
    }
  </style>
</head>
<body>
  <header>
    <h1><span>⚽</span> Referee — Alexa+ MCP Simulator</h1>
    <span>Protocol: 2025-11-25 | Streamable HTTP</span>
  </header>

  <div class="main-container">
    <!-- Chat Panel -->
    <div class="chat-panel">
      <div class="chat-history" id="chatHistory">
        <div class="msg alexa">
          Welcome! I am Referee. Say a deal (e.g., "I lent Aman 1500, he'll pay Friday") or ask for a verdict/ledger.
        </div>
      </div>
      <div class="input-area">
        <button class="btn btn-mic" id="micBtn" title="Voice Input">🎤</button>
        <input type="text" id="userInput" placeholder="Speak or type a handshake deal..." />
        <button class="btn" id="sendBtn">Send</button>
      </div>
    </div>

    <!-- Live JSON-RPC Traffic Inspector -->
    <div class="inspector-panel">
      <div class="inspector-header">
        <span>Raw MCP JSON-RPC Traffic</span>
        <span id="rpcCount">0 calls</span>
      </div>
      <div class="traffic-log" id="trafficLog">
        <!-- Live JSON-RPC frames appended here -->
      </div>
    </div>
  </div>

  <script src="/simulator/app.js"></script>
</body>
</html>
